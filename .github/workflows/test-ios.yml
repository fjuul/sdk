name: Test iOS

on:
  pull_request:
    paths:
      - Package.swift
      - Package.resolved
      - ios/**
      - .github/workflows/**

jobs:

  test:

    runs-on: xcode-27

    steps:
    - uses: actions/checkout@v7
    - run: sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
    - name: install SwiftLint
      run: brew install swiftlint
    - name: lint
      run: |
        (cd ios; swiftlint)
    - name: xcode test Fjuul SDK-Package
      run: |
        set -o pipefail && xcodebuild \
          -scheme "Fjuul SDK-Package" \
          -sdk iphonesimulator \
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0' \
          test | xcpretty
    - name: xcode test ExampleApp
      run: |
        set -o pipefail && xcodebuild \
          -workspace ios/SDK.xcworkspace \
          -scheme ExampleApp \
          -sdk iphonesimulator \
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0' \
          test | xcpretty
